# EkbatanRoom Signaling Coordinator Configuration
server:
  port: "7880"
  read_timeout: 15s
  write_timeout: 15s
  shutdown_timeout: 5s

sfu:
  grpc_addr: "127.0.0.1:50051"
  request_timeout: 5s

livekit:
  ping_interval: 10
  ping_timeout: 20
  server_version: "1.53.0"

rtc:
  ice_servers:
    - urls:
        - "stun:stun.l.google.com:19302"

telemetry:
  log_level: "info"
  log_format: "json"
  log_raw_sdp: false
  tracing_enabled: false
  trace_sample_rate: 1.0
  otlp_endpoint: ""
  metrics_enabled: true
