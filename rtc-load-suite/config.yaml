# پیکربندی اتصال به پشته EkbatanRoom برای اجرای لود تست
livekit_url: "ws://localhost:7880"
api_key: "devkey"
api_secret: "secret"

# اندپوینت‌های مشاهده‌پذیری سرورها
signaling_metrics_url: "http://localhost:7880/metrics"
sfu_metrics_url: "http://localhost:9090/metrics"
sfu_grpc_addr: "localhost:50051"

# خروجی گزارش‌ها
results_dir: "./test-results"
report_file: "./test-results/loadtest-report.json"

# تنظیمات پیش‌فرض شبیه‌سازی
default_codec: "vp8"
default_resolution: "high" # high (720p), medium (360p), low (180p)
enable_simulcast: true
testers_per_second: 5
