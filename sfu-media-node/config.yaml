network:
  listen_ip: "0.0.0.0"
  # در محیط Production حتماً IP عمومی سرور را به صورت صریح وارد کنید
  announced_address: "auto"
  port_range: "40000-49999"
  grpc_port: 50051

worker:
  # 0 = به تعداد هسته‌های پردازنده (توصیه: برابر با تعداد Physical Cores)
  worker_count: 0
  capacity_weight: 1000
  spillover_threshold_percent: 75.0
  # حیاتی برای Performance: هرگز در پروداکشن روی debug نباشد!
  log_level: "warn"
  log_tags:
    - info
    - ice
    - dtls
    - bwe
  dtls_certificate_file: null
  dtls_private_key_file: null

webrtc_transport:
  # شروع متعادل (1.5 Mbps) برای جلوگیری از اشباع اولیه لینک‌های ضعیف و شروع سریع کیفیت HD
  initial_available_outgoing_bitrate: 1500000
  # سقف دریافت از هر کلاینت (6 Mbps برای ویدئوی 1080p و Screen Share کاملاً کافی و امن است)
  max_incoming_bitrate: 6000000
  # حتماً 0 یا null باشد تا BWE در شبکه‌های ضعیف بتواند نرخ ارسال را تا لایه‌های پایین کاهش دهد
  min_outgoing_bitrate: 0
  # سقف ارسال به هر کلاینت (15 Mbps برای دریافت همزمان گرید ویدیوها + اشتراک تصویر)
  max_outgoing_bitrate: 15000000
  # بافر ۴ مگابایتی سوکت کرنل برای جلوگیری از حذف بسته‌های Burst در Keyframeهای اشتراک تصویر
  send_buffer_size: 4194304
  recv_buffer_size: 4194304
  max_send_message_size: 262144
  max_receive_message_size: 262144
  sctp_send_buffer_size: 1048576
  sctp_per_stream_send_queue_limit: 524288
  sctp_max_receiver_window_buffer_size: 1048576
  enable_tcp: true

plain_transport:
  max_send_message_size: 262144
  max_receive_message_size: 262144
  sctp_send_buffer_size: 1048576

audio_level_observer:
  # بازه 300ms تعادل عالی بین تشخیص سریع گوینده فعال و سربار پیام‌های gRPC ایجاد می‌کند
  interval_ms: 300
  threshold_dbov: -75

router_codecs:
  enable_opus: true
  enable_vp8: true
  enable_h264: true
  # فعال‌سازی VP9 برای پشتیبانی از SVC در اشتراک تصویر و دوربین
  enable_vp9: true
  # شروع با 800kbps برای جلوگیری از Bufferbloat اولیه روی اینترنت همراه
  google_start_bitrate: 800

observability:
  # در محیط عملیاتی حتماً info باشد
  log_level: "info"
  log_format: "json"
  tracing_enabled: false
  otlp_endpoint: "http://localhost:4317"
  trace_sample_rate: 0.05
  metrics_enabled: true
  metrics_addr: "0.0.0.0:9090"
  log_raw_sdp: false