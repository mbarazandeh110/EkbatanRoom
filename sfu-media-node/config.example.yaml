# ==============================================================================
# SFU Media Node Configuration File (YAML)
# ==============================================================================
# این فایل الگوی جامع و رسمی تمامی تنظیمات sfu-media-node بر مبنای آخرین
# استانداردها و APIهای غیرمنسوخ (Non-Deprecated) کتابخانه mediasoup است.
#
# قابلیت‌های منسوخ‌شده مدیاسوپ که در این معماری جایگزین شده‌اند:
#   - rtcMinPort و rtcMaxPort منسوخ شده‌اند -> جایگزین: port_range
#   - listenIp و listenIps و TransportListenIp منسوخ شده‌اند -> جایگزین: listen_info (ListenInfo)
#   - rtcpPort در ترنسپورت‌ها منسوخ شده است -> جایگزین: listen_info و rtcp_listen_info
#   - announcedIp منسوخ شده است -> جایگزین: announced_address در ListenInfo
#
# اولویت اعمال تنظیمات (Twelve-Factor App):
#   ۱. آرگومان خط فرمان (--config <file> یا -c <file>)
#   ۲. متغیر محیطی SFU_CONFIG_FILE
#   ۳. فایل‌های پیش‌فرض در مسیر جاری (config.yaml یا config.yml)
#   ۴. مقادیر پیش‌فرض تعبیه‌شده در کد
# * نکته: متغیرهای محیطی تعریف‌شده در سیستم بالاترین اولویت را داشته و مقادیر این فایل را بازنویسی می‌کنند.
# ==============================================================================

# ------------------------------------------------------------------------------
# ۱. تنظیمات شبکه و ListenInfo (Network & ListenInfo)
# ------------------------------------------------------------------------------
network:
  # آدرس IP محلی که سوکت‌های رسانه روی آن گوش می‌دهند.
  # متغیر محیطی معادل: MEDIASOUP_LISTEN_IP
  # پیش‌فرض: "0.0.0.0"
  listen_ip: "0.0.0.0"

  # آدرس IP عمومی یا FQDN اعلام‌شده در ICE کاندیدها برای کلاینت‌ها (جایگزین announcedIp قدیمی).
  # مقادیر معتبر:
  #   - یک آدرس IP مشخص (مثال: "198.51.100.1")
  #   - "auto" یا null: شناسایی خودکار اولین IP غیر لوپ‌بک هاست
  #   - "none": عدم اعلان هیچ کاندیدای خارجی
  # متغیرهای محیطی معادل: MEDIASOUP_ANNOUNCED_ADDRESS (یا MEDIASOUP_ANNOUNCED_IP)
  # پیش‌فرض: null (شناسایی خودکار)
  announced_address: null

  # بازه مدرن پورت‌های UDP برای ترافیک RTC (جایگزین rtcMinPort و rtcMaxPort منسوخ‌شده).
  # قالب‌های پشتیبانی‌شده: "40000-49999" یا "40000..=49999"
  # متغیرهای محیطی معادل: RTC_PORT_RANGE (یا PORT_RANGE)
  # پیش‌فرض: "40000-49999"
  port_range: "40000-49999"

  # پورت شنود سرور کنترلی gRPC (سرویس SfuMediaEngineService).
  # متغیر محیطی معادل: GRPC_PORT
  # پیش‌فرض: 50051
  grpc_port: 50051

# ------------------------------------------------------------------------------
# ۲. استخر ورکرها و مقیاس‌پذیری داخلی نود (Worker Pool & Intra-Node Scaling)
# ------------------------------------------------------------------------------
worker:
  # تعداد پروسه‌های ورکر مستقل mediasoup.
  # مقدار 0 به معنای تخصیص خودکار بر اساس تعداد هسته‌های منطقی CPU است.
  # متغیر محیطی معادل: MEDIASOUP_WORKER_COUNT
  # پیش‌فرض: 0 (برابر تعداد هسته‌های پردازنده)
  worker_count: 0

  # وزن اسمی ظرفیت هر ورکر جهت بالانس بار و انتخاب کم‌بارترین ورکر.
  # متغیر محیطی معادل: SFU_WORKER_CAPACITY_WEIGHT
  # پیش‌فرض: 1000
  capacity_weight: 1000

  # درصد آستانه بار ورکر (۱ تا ۱۰۰) که در صورت عبور از آن، اتاق روی ورکر دیگر سرریز می‌شود.
  # متغیر محیطی معادل: SFU_WORKER_SPILLOVER_THRESHOLD_PERCENT
  # پیش‌فرض: 80.0
  spillover_threshold_percent: 80.0

  # سطح ثبت لاگ پروسه C++ ورکر mediasoup.
  # گزینه‌ها: "debug", "warn", "error", "none"
  # متغیر محیطی معادل: MEDIASOUP_WORKER_LOG_LEVEL
  # پیش‌فرض: "warn"
  log_level: "warn"

  # تگ‌های فیلتر لاگ پروسه ورکر.
  # تگ‌های معتبر: info, ice, dtls, rtp, srtp, rtcp, rtx, bwe, score, simulcast, svc, sctp, message
  # متغیر محیطی معادل: MEDIASOUP_WORKER_LOG_TAGS (با کاما جدا شوند)
  log_tags:
    - info
    - ice
    - dtls
    - rtp
    - srtp
    - rtcp
    - rtx
    - bwe
    - score

  # مسیر فایل گواهی سفارشی DTLS (در صورت تمایل به استفاده از گواهی اختصاصی).
  # متغیر محیطی معادل: MEDIASOUP_DTLS_CERT یا MEDIASOUP_WORKER_DTLS_CERT
  # پیش‌فرض: null
  dtls_certificate_file: null

  # مسیر فایل کلید خصوصی سفارشی DTLS.
  # متغیر محیطی معادل: MEDIASOUP_DTLS_KEY یا MEDIASOUP_WORKER_DTLS_KEY
  # پیش‌فرض: null
  dtls_private_key_file: null

# ------------------------------------------------------------------------------
# ۳. تنظیمات ترنسپورت وب‌آرتی‌سی (WebRtcTransport Parameters)
# ------------------------------------------------------------------------------
webrtc_transport:
  # برآورد پهنای باند اولیه ارسال بر حسب bps.
  # متغیر محیطی معادل: MEDIASOUP_INITIAL_AVAILABLE_OUTGOING_BITRATE
  # پیش‌فرض: 1000000 (۱ مگابیت) | مقدار پیشنهادی پروداکشن: 3000000 (۳ مگابیت)
  initial_available_outgoing_bitrate: 3000000

  # سقف بیت‌ریت ورودی هر ناشر (Publisher) بر حسب bps.
  # متغیر محیطی معادل: MEDIASOUP_MAX_INCOMING_BITRATE
  # پیش‌فرض: null (نامحدود) | مقدار پیشنهادی: 4000000 (۴ مگابیت)
  max_incoming_bitrate: 4000000

  # حداقل کف بیت‌ریت خروجی بر حسب bps جهت پیشگیری از فریز ویدیو و فروپاشی تخمین پهنای باند (BWE).
  # متغیر محیطی معادل: MEDIASOUP_MIN_OUTGOING_BITRATE
  # پیش‌فرض: null (پیش‌فرض داخلی: 600000)
  min_outgoing_bitrate: 600000

  # سقف مطلق بیت‌ریت خروجی بر حسب bps.
  # متغیر محیطی معادل: MEDIASOUP_MAX_OUTGOING_BITRATE
  # پیش‌فرض: null (نامحدود) | مقدار پیشنهادی: 15000000 (۱۵ مگابیت)
  max_outgoing_bitrate: 15000000

  # حداکثر اندازه مجاز پیام‌های ارسالی دیتاچنل SCTP بر حسب بایت.
  # متغیر محیطی معادل: MEDIASOUP_MAX_SEND_MESSAGE_SIZE
  # پیش‌فرض: 5000000 (۵ مگابایت)
  max_send_message_size: 5000000

  # حداکثر اندازه مجاز پیام‌های دریافتی دیتاچنل SCTP بر حسب بایت.
  # پیش‌فرض: 5000000 (۵ مگابایت)
  max_receive_message_size: 5000000

  # ظرفیت بافر ارسال SCTP بر حسب بایت.
  # متغیر محیطی معادل: MEDIASOUP_SCTP_SEND_BUFFER_SIZE
  # پیش‌فرض: 7000000 (۷ مگابایت)
  sctp_send_buffer_size: 7000000

  # محدودیت صف ارسال برای هر استریم SCTP بر حسب بایت.
  # پیش‌فرض: 5000000 (۵ مگابایت)
  sctp_per_stream_send_queue_limit: 5000000

  # حداکثر اندازه بافر پنجره دریافت SCTP بر حسب بایت.
  # پیش‌فرض: 7000000 (۷ مگابایت)
  sctp_max_receiver_window_buffer_size: 7000000

  # اندازه بافر ارسال سوکت UDP کرنل لینوکس (SO_SNDBUF) در ListenInfo بر حسب بایت.
  # متغیر محیطی معادل: MEDIASOUP_WEBRTC_SEND_BUFFER_SIZE
  # پیش‌فرض: null | مقدار پیشنهادی: 1048576 (۱ مگابایت)
  send_buffer_size: 1048576

  # اندازه بافر دریافت سوکت UDP کرنل لینوکس (SO_RCVBUF) در ListenInfo بر حسب بایت.
  # متغیر محیطی معادل: MEDIASOUP_WEBRTC_RECV_BUFFER_SIZE
  # پیش‌فرض: null | مقدار پیشنهادی: 1048576 (۱ مگابایت)
  recv_buffer_size: 1048576

# ------------------------------------------------------------------------------
# ۴. تنظیمات ترنسپورت عمومی (PlainTransport Parameters)
# ------------------------------------------------------------------------------
plain_transport:
  # حداکثر اندازه پیام ارسالی SCTP در PlainTransport بر حسب بایت.
  # متغیر محیطی معادل: MEDIASOUP_PLAIN_MAX_SEND_MESSAGE_SIZE
  # پیش‌فرض: 5000000
  max_send_message_size: 5000000

  # حداکثر اندازه پیام دریافتی SCTP در PlainTransport بر حسب بایت.
  # متغیر محیطی معادل: MEDIASOUP_PLAIN_MAX_RECEIVE_MESSAGE_SIZE
  # پیش‌فرض: 5000000
  max_receive_message_size: 5000000

  # ظرفیت بافر ارسال SCTP برای PlainTransport بر حسب بایت.
  # متغیر محیطی معادل: MEDIASOUP_PLAIN_SCTP_SEND_BUFFER_SIZE
  # پیش‌فرض: 7000000
  sctp_send_buffer_size: 7000000

# ------------------------------------------------------------------------------
# ۵. مشاهده‌گر سطح صدا و گوینده فعال (Audio Level Observer)
# ------------------------------------------------------------------------------
audio_level_observer:
  # دوره تناوب ارزیابی سطح بلندی صدای گویندگان بر حسب میلی‌ثانیه.
  # متغیر محیطی معادل: MEDIASOUP_AUDIO_OBSERVER_INTERVAL_MS
  # پیش‌فرض: 500
  interval_ms: 500

  # حداقل آستانه بلندی صدا بر حسب dBov (-127 تا 0) برای تشخیص صحبت کردن.
  # متغیر محیطی معادل: MEDIASOUP_AUDIO_OBSERVER_THRESHOLD_DB
  # پیش‌فرض: -80
  threshold_dbov: -80

# ------------------------------------------------------------------------------
# ۶. کدک‌های روتر مدیا (Router Codecs & Parameters)
# ------------------------------------------------------------------------------
router_codecs:
  # فعال‌سازی کدک صوتی Opus (48000Hz, 2ch).
  # پیش‌فرض: true
  enable_opus: true

  # فعال‌سازی کدک تصویری VP8 (90000Hz).
  # پیش‌فرض: true
  enable_vp8: true

  # فعال‌سازی کدک تصویری H.264 (Baseline/Main/High profile-level-id=42e01f).
  # پیش‌فرض: true
  enable_h264: true

  # فعال‌سازی کدک تصویری پیشرفته VP9 (پشتیبانی از SVC و لایه‌های فضایی).
  # متغیر محیطی معادل: MEDIASOUP_CODECS_ENABLE_VP9
  # پیش‌فرض: false
  enable_vp9: false

  # بیت‌ریت اولیه گوگل (x-google-start-bitrate) در پارامترهای کدک‌های ویدیویی بر حسب kbps.
  # متغیر محیطی معادل: MEDIASOUP_CODECS_START_BITRATE
  # پیش‌فرض: 1000 (۱ مگابیت)
  google_start_bitrate: 1000

# ------------------------------------------------------------------------------
# ۷. مشاهده‌پذیری، لاگ، تریسینگ توزیع‌شده و متریک‌ها (Observability & APM)
# ------------------------------------------------------------------------------
observability:
  # سطح ثبت لاگ سیستم در خروجی استاندارد.
  # گزینه‌ها: "trace", "debug", "info", "warn", "error"
  # متغیر محیطی معادل: OBS_LOG_LEVEL
  # پیش‌فرض: "info"
  log_level: "info"

  # قالب ساختار لاگ‌ها.
  # گزینه‌ها:
  #   - "json": برای سرورهای ابری، کوبرنتیز و الستیک‌سرچ
  #   - "pretty" یا "text": برای توسعه محلی و دیباگ
  # متغیر محیطی معادل: OBS_LOG_FORMAT
  # پیش‌فرض: "json"
  log_format: "json"

  # فعال‌سازی ردیابی توزیع‌شده OpenTelemetry (OTLP gRPC) به APM.
  # متغیر محیطی معادل: OBS_TRACING_ENABLED
  # پیش‌فرض: false
  tracing_enabled: false

  # آدرس کلکتور OpenTelemetry / Jaeger / Tempo جهت ارسال Spanها.
  # متغیر محیطی معادل: OBS_OTLP_ENDPOINT یا OBS_TRACING_ENDPOINT
  # پیش‌فرض: "http://localhost:4317"
  otlp_endpoint: "http://localhost:4317"

  # نرخ نمونه‌برداری تریس‌ها بین 0.0 تا 1.0 (خطاها همواره ۱۰۰٪ ثبت می‌شوند).
  # متغیر محیطی معادل: OBS_TRACE_SAMPLE_RATE یا OBS_TRACING_SAMPLE_RATE
  # پیش‌فرض: 0.1 (۱۰ درصد نمونه‌برداری)
  trace_sample_rate: 0.1

  # فعال‌سازی سرور HTTP سبک پرومتئوس جهت اسکرپ متریک‌ها در /metrics.
  # متغیر محیطی معادل: OBS_METRICS_ENABLED
  # پیش‌فرض: true
  metrics_enabled: true

  # آدرس و پورت شنود سرور متریک‌های Prometheus / VictoriaMetrics.
  # متغیر محیطی معادل: OBS_METRICS_ADDR
  # پیش‌فرض: "0.0.0.0:9090"
  metrics_addr: "0.0.0.0:9090"

  # آیا متن خام کاندیدهای SDP در سطح دیباگ لاگ شود؟ (فقط برای خطایابی امن).
  # متغیر محیطی معادل: OBS_LOG_RAW_SDP
  # پیش‌فرض: false
  log_raw_sdp: false

# ------------------------------------------------------------------------------
# ۸. لایسنسینگ آفلاین نسخه سازمانی (Enterprise Ed25519 Licensing)
# ------------------------------------------------------------------------------
license:
  # توکن لایسنس آفلاین امضا شده با کلید نامتقارن Ed25519.
  # فرمت توکن: EKB1.<Base64URL_Payload>.<Base64URL_Signature>
  # متغیر محیطی معادل: EKBATAN_LICENSE_KEY
  # پیش‌فرض: null (نسخه Community - بدون پایپینگ بین‌نودی)
  token: null

  # کلید عمومی ۳۲ بایتی Ed25519 در قالب هگزادسیمال جهت اعتبارسنجی آفلاین (Air-Gapped).
  # متغیر محیطی معادل: EKBATAN_LICENSE_PUBLIC_KEY
  # پیش‌فرض: null
  public_key_hex: null
