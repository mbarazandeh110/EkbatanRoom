[package]
name = "sfu-media-node"
version = "0.1.0"
edition = "2021"

[lib]
name = "sfu_media_node"
path = "src/lib.rs"

[[bin]]
name = "sfu-media-node"
path = "src/main.rs"

[dependencies]
mediasoup = "=0.31.0"
tonic = "=0.12.3"
prost = "=0.13.5"
prost-types = "=0.13.5"
tokio = { version = "1.43.0", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
dashmap = "6.1.0"
parking_lot = "0.12.3"
thiserror = "2.0.12"
async-trait = "0.1.86"
sha2 = "0.10.8"
hex = "0.4.3"
uuid = { version = "1.15.1", features = ["v4"] }

[build-dependencies]
tonic-build = "=0.12.3"
protoc-bin-vendored = "=3.3.0"
