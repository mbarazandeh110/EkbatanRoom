services:
  sfu-media-node:
    build:
      context: ../sfu-media-node
      dockerfile: Dockerfile
    container_name: sfu-media-node
    restart: unless-stopped
    network_mode: host
    environment:
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      - MEDIASOUP_ANNOUNCED_IP=127.0.0.1
      - RTC_MIN_PORT=40000
      - RTC_MAX_PORT=49999
      - GRPC_PORT=50051
      - OBS_LOG_LEVEL=info
      - OBS_LOG_FORMAT=json
      - OBS_METRICS_ENABLED=true
      - OBS_METRICS_ADDR=0.0.0.0:9090
    ports:
      - "50051:50051"
      - "9090:9090"
      - "40000-49999:40000-49999/udp"

  signaling-coordinator:
    build:
      context: ../signaling-coordinator
      dockerfile: Dockerfile
    container_name: signaling-coordinator
    restart: unless-stopped
    network_mode: host
    depends_on:
      - sfu-media-node
    environment:
      - PORT=7880
      - SFU_GRPC_ADDR=127.0.0.1:50051
      - OBS_LOG_LEVEL=info
      - OBS_LOG_FORMAT=json
      - OBS_METRICS_ENABLED=true
    ports:
      - "7880:7880"
      - "9091:9091"
